[package]
name = "wisdom"
version = "0.1.0"
edition = "2024"
authors = ["Zorblock"]

[lib]
name = "wisdom_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.dev]
# Keep local Tauri iteration fast: avoid large debug symbols while preserving
# Cargo's incremental recompilation for the application crate.
debug = 0
incremental = true

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
ctrlc = "3.5.2"
flate2 = "1.1"
keyring = { version = "3.6", features = ["windows-native"] }
mc-launcher-core = "0.1.2"
open = "5.3"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
sha2 = "0.10"
tauri = { version = "2", features = [] }
urlencoding = "2.1"
winreg = "0.55"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
