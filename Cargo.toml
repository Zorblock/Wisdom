[package]
name = "wisdom"
version = "0.1.0"
edition = "2024"
description = "A clean Windows Minecraft launcher"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
keyring = { version = "3.6", features = ["windows-native"] }
open = "5.3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rand = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
sha2 = "0.10"
slint = { version = "1.15", features = ["backend-winit", "renderer-skia"] }
urlencoding = "2.1"
winreg = "0.55"
zip = { version = "2.2", default-features = false, features = ["deflate"] }

[build-dependencies]
slint-build = "1.15"
winres = "0.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
